# Configuration for BEAM model training (use with scripts/train.py)

# Model parameters
model:
  n_feat: 128            # Number of features in U-Net
  epsilon: 0.0001        # Bound t for stability
  drop_prob: 0.1         # Dropout probability for classifier-free guidance
  architecture: "flow"   # Parametrization: "flow" (velocity, OT schedule, ODE sampling), or "noise" / "score" / "v" (VP schedule, SDE sampling)
  channel_mults: [1,1,2,2,2] # Channel multipliers for the U-Net: layer i has n_feat*channel_mults[i] features
  heads_at: [2,3,4]      # Use attention at these indices in above channel_mults
  num_res: 2             # Number of residual blocks in each layer; if int, same for all layers
  emb_dim: 256           # width of the fused time+camera+context conditioning embedding
  time_dim: 128          # Fourier time-feature width (the archived V1 trainer hardcoded 64)
  context_dim: 64        # cross-attention token width (the archived V1 trainer hardcoded 64)
  use_cross_attn: False   # A/B flag — set False to train the FiLM-only model
  t_sampler: "uniform"     # Base sampler: "uniform", "logit_normal", "uniform_sigma", "theta_uniform"
                            
  t_logit_mean: 0.0         #logit-normal location (t = sigmoid(N(mean, std)))
  t_logit_std: 1.06         #logit-normal scale (both ignored for "uniform")
  t_low_boost_prob: 0.0   #fraction of samples redirected to the low-t band
  t_low_boost_min: 0.001    # band lower edge
  t_low_boost_max: 0.1      # band upper edge 
  sigma_min: 0.002           # minimum sigma for the uniform_sigma sampler

# Data parameters
data:

  angle_path: /path/to/angles.pkl  # Angle dictionary from data/process_angles.py
  ccd_folder:
    - /path/to/processed_images_256x256  # Folder containing processed images
  image_shape: [256,256] # Shape of the images
  patch_size: null       # Shape of the patches; null for no patches
  repeat_factor: 1       # Iterate repeat_factor times over the dataset each epoch
  valid_orbits: [46-54]  # Validation orbits as inclusive ranges, e.g. [10-12, 14-20]; every other
                         # orbit trains. Sector s = orbits 2s+7 and 2s+8 (sector 2 = orbits 11-12).
  
  compute_stats: True    # One GPU pass over the TRAIN split before training computes the
                         # mean/std of exposure-equalized flux; saved to <save_dir>/image_stats.pkl
  stats_path: null       # Alternative to compute_stats: path to an existing image_stats.pkl
                         # (e.g. from a previous run) — reused verbatim and copied into save_dir
  stats_max_images: null # Evenly-spaced file cap for the stats pass (null = all)
  camera_number: '3'     # AUDIT: informational only for training (camera comes from each
                         # filename; folder choice selects the camera). Used by generation.
  add_exposure_flag: False   # append ±1 feature marking the orbit>=61 (10-minute and shorter cadence) regime
  normalize_context: True   # standardize conditioning with train-orbit statistics

ema:
  beta: 0.9999             # EMA decay rate
  update_after_step: 10000 # Number of warmup steps before updating EMA

optimizer:
  max_lr: 0.0001    # Maximum learning rate
  min_lr: 0.000001  # Minimum learning rate
  weight_decay: 0.00 # Weight decay
  warmup_steps: 1000 # Number of warmup steps
  grad_clip: 1.0     # Gradient clip

# Training parameters
training:
  n_epoch: 600           # Maximum number of epochs
  batch_size: 24         # Batch size
  patience: 300          # Early stopping patience
  mixed_precision: True  # Use BF16 for training
  loss_display_ema: 0.98 # EMA weight for the DISPLAYED train loss only
                         #           (was tied to ema.beta=0.9999, which froze the readout)
  valid_seed: 42         # seed for the deterministic validation pass (fixed t + noise)
  valid_t_bins: 10       # number of t-bins for per-t validation loss logging

# Checkpoint parameters
checkpoint:
  save_model: True       # Save model checkpoints
  epoch_checkpoint: 50    # Save samples every N epochs
  checkpoint_gpu: 0      # GPU ID to use for checkpoints
  save_weights_only: False # Save only weights
  save_best_only: True   # Save best model only at each checkpoint.

load_checkpoint: null

# Weights & Biases parameters
wandb:
  enabled: True          # Enable W&B logging
  project: "PROJECT_NAME"   # W&B project name
  mode: "online"         # W&B mode (online, offline, disabled)
  log_freq: 20           # Log batch metrics every N batches (higher value = less traffic)
  log_samples_freq: 100  # Log sample images every N epochs
  log_model_freq: 100    # Log model weights every N epochs
  model_name: "MODEL_NAME" # Base name for the model and W&B run

# Paths
paths:
  save_dir: "model_outputs/DESIRED_PATH"  # Directory to save model and results

# Distributed training
distributed:
  world_size: 2       # Number of GPUs (null = auto-detect)
